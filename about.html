<!DOCTYPE html>
<html lang="zh-tw">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我介紹</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to bottom, #87CEEB, #1E90FF);
        font-family: Arial, sans-serif;
        color: white;
      }

      .container {
        text-align: center;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        background-color: #ffffff;
        color: #1E90FF;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #87CEEB;
      }

      .intro {
        margin-top: 20px;
        font-size: 18px;
        display: none; /* 初始隱藏 */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button onclick="showIntro()">點擊顯示自我介紹</button>
      <div class="intro" id="intro">
        <p>名字：壽俊維</p>
        <p>學號：412737164</p>
        <p>興趣：看書</p>
      </div>
    </div>

    <script>
      function showIntro() {
        const intro = document.getElementById('intro');
        intro.style.display = 'block'; // 顯示自我介紹
      }
    </script>
  </body>
</html>
